<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cours - Mon Classeur Numérique</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Press Start 2P',cursive;
    color:white;

    background:
    linear-gradient(
        -45deg,
        #021b79,
        #0575e6,
        #003566,
        #4ea8de
    );

    background-size:400% 400%;
    animation:bg 12s ease infinite;

    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        rgba(255,255,255,.03) 2px,
        transparent 2px
    ),
    linear-gradient(
        90deg,
        rgba(255,255,255,.03) 2px,
        transparent 2px
    );

    background-size:32px 32px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    radial-gradient(white 1px, transparent 1px);

    background-size:80px 80px;
    opacity:.4;

    pointer-events:none;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    text-align:center;
    padding-top:60px;
}

h1{
    font-size:2rem;

    text-shadow:
        0 0 10px #4ea8de,
        0 0 25px #4ea8de;

    margin-bottom:50px;
}

.content{
    background:rgba(255,255,255,.08);
    border:4px solid rgba(255,255,255,.2);
    border-radius:15px;
    padding:40px;
    min-height:250px;
}

.content p{
    font-size:.8rem;
    line-height:2;
}

.back{
    display:inline-block;
    margin-top:40px;

    padding:18px 25px;

    color:white;
    text-decoration:none;

    border:4px solid rgba(255,255,255,.2);
    border-radius:15px;

    background:rgba(255,255,255,.08);

    transition:.3s;
}

.back:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px #4ea8de;
}

</style>

</head>

<body>

<div class="container">

```
<h1>📚 Cours</h1>

<div class="content">
    <p>
        Les cours seront disponibles ici.
    </p>
</div>

<a href="index.html" class="back">← Retour à l'accueil</a>
```

</div>

</body>
</html>
